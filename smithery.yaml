name: haiwaizhijia
displayName: Haiwaizhijia Texas Villa Investments
description: Premium Texas Villa Investments - 2134 villas Austin Houston Dallas 6-8% Guaranteed Annual ROI - Public server with honest OAuth stub for isitagentready per RFC 8414
homepage: https://haiwaizhijia.com
repository: https://github.com/rajeshphit/haiwaizhijia-mcp
version: 1.3.8
license: MIT

# Deployment payload with configSchema - THIS FIXES WARNING
startCommand:
  type: http
  url: https://haiwaizhijia.com/mcp-haiwaizhijia/
  configSchema:
    $schema: https://json-schema.org/draft/2020-12/schema
    type: object
    title: Haiwaizhijia Configuration
    description: Configuration for Texas Villa Investments. No API keys required - public server with honest OAuth stub for isitagentready.
    properties:
      city:
        type: string
        title: Preferred City
        description: Preferred Texas city Austin Houston Dallas with 6-8% ROI
        default: Austin
        x-from:
          query: city
      budget:
        type: number
        title: Budget USD
        description: Budget USD e.g. 500000 for villa search
        default: 500000
        x-from:
          query: budget
    additionalProperties: false

capabilities:
  tools: true
  prompts: true
  resources: false
